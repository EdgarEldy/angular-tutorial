<div class="app">

  <!-- ═══════════════════════════════════════════════════════════════════════
       Sidebar — fixed 248 px, permanently dark background (#111827)
       ═══════════════════════════════════════════════════════════════════════ -->
  <aside class="sidebar">

    <!-- Brand: clicking the logo navigates to the home route -->
    <a class="sb-brand" routerLink="/">
      <div class="brand-icon">
        <mat-icon fontSet="material-icons-outlined">bolt</mat-icon>
      </div>
      <span class="brand-name">Angular Tutorial</span>
    </a>

    <!-- Navigation links -->
    <nav class="sb-nav">
      <span class="sec-label">Menu</span>

      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          <mat-icon fontSet="material-icons-outlined">{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }

      <div class="sb-div"></div>
      <span class="sec-label">Administration</span>

      @for (item of adminItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active">
          <mat-icon fontSet="material-icons-outlined">{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Footer: sign-out action (wired up in feature/auth) -->
    <div class="sb-footer">
      <button class="nav-logout">
        <mat-icon fontSet="material-icons-outlined">logout</mat-icon>
        Sign out
      </button>
    </div>

  </aside>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Main area — sticky toolbar + scrollable content
       ═══════════════════════════════════════════════════════════════════════ -->
  <div class="app-main">

    <!-- Toolbar -->
    <header class="toolbar">
      <!-- Page title derived from active route via pageTitle computed signal -->
      <span class="tb-title">{{ pageTitle() }}</span>

      <div class="tb-actions">

        <!-- Theme toggle: sets data-theme on <html> via effect() in shell.ts -->
        <button
          class="theme-btn"
          (click)="toggleTheme()"
          [title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          <mat-icon fontSet="material-icons-outlined">
            {{ darkMode() ? 'light_mode' : 'dark_mode' }}
          </mat-icon>
        </button>

        <!-- Notification bell (wired in feature/notifications) -->
        <div class="notif-wrap">
          <button class="icon-btn" aria-label="Notifications">
            <mat-icon fontSet="material-icons-outlined">notifications_none</mat-icon>
          </button>
          <div class="notif-dot"></div>
        </div>

        <!-- Profile button — stopPropagation prevents the document:click
             HostListener from immediately closing the dropdown on open -->
        <button
          class="profile-btn"
          (click)="toggleProfile($event)"
          aria-label="Open profile menu"
          aria-haspopup="true"
          [attr.aria-expanded]="profileOpen()">
          <div class="avatar">EE</div>
          <div class="profile-info">
            <div class="profile-name">Edgar Eldy</div>
            <div class="profile-role">Admin</div>
          </div>
          <mat-icon class="chevron" fontSet="material-icons-outlined">expand_more</mat-icon>
        </button>

      </div>

      <!-- Profile dropdown — rendered inside toolbar so position:absolute
           is relative to the toolbar's stacking context (z-index: 10) -->
      @if (profileOpen()) {
        <!-- stopPropagation prevents clicks inside the dropdown from closing it
             via the document:click HostListener on the shell -->
        <div class="dropdown" (click)="$event.stopPropagation()">
          <div class="dd-hdr">
            <div class="dd-name">Edgar Eldy</div>
            <!-- &#64; encodes @ — Angular template compiler strips bare @ in text -->
            <div class="dd-email">ed.eldy21&#64;gmail.com</div>
          </div>
          <button class="dd-item">
            <mat-icon fontSet="material-icons-outlined">person_outline</mat-icon>
            Profile
          </button>
          <button class="dd-item">
            <mat-icon fontSet="material-icons-outlined">settings</mat-icon>
            Settings
          </button>
          <div class="dd-div"></div>
          <button class="dd-item danger">
            <mat-icon fontSet="material-icons-outlined">logout</mat-icon>
            Sign out
          </button>
        </div>
      }

    </header>

    <!-- Page content — scrollable, padded, app-bg coloured -->
    <main class="content">
      <router-outlet />
    </main>

  </div>

</div>
