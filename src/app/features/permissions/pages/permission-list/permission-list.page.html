<app-page-header title="Permissions">
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    New permission
  </button>
</app-page-header>

@if (loading()) {
  <app-loading />
} @else if (error()) {
  <app-error-banner [error]="error()!" (retry)="loadPermissions()" />
} @else if (permissions().length === 0) {
  <app-empty-state
    icon="lock_open"
    title="No permissions defined yet"
    message="Create your first permission to assign it to roles.">
    <button mat-flat-button color="primary" (click)="openCreateDialog()">New permission</button>
  </app-empty-state>
} @else {
  <table mat-table [dataSource]="permissions()" class="mat-elevation-z2">
    <!-- Resource column -->
    <ng-container matColumnDef="resource">
      <th mat-header-cell *matHeaderCellDef>Resource</th>
      <td mat-cell *matCellDef="let p">{{ p.resource }}</td>
    </ng-container>

    <!-- Action column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let p">{{ p.action }}</td>
    </ng-container>

    <!-- Combined column -->
    <ng-container matColumnDef="combined">
      <th mat-header-cell *matHeaderCellDef>Combined</th>
      <td mat-cell *matCellDef="let p">{{ p.resource }}:{{ p.action }}</td>
    </ng-container>

    <!-- Actions column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p">
        <button
          mat-icon-button
          color="warn"
          aria-label="Delete permission"
          (click)="deletePermission(p)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
}
