<div class="error-page">
  <mat-icon class="error-page__icon">lock</mat-icon>
  <h1 class="error-page__code">403</h1>
  <h2 class="error-page__title">Access denied</h2>
  <p class="error-page__message">
    You do not have permission to view this page. Contact your administrator
    if you believe this is a mistake.
  </p>
  <a mat-flat-button color="primary" routerLink="/dashboard">
    <mat-icon>arrow_back</mat-icon>
    Go to dashboard
  </a>
</div>
