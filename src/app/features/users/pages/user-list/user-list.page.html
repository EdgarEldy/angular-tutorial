<app-page-header title="Users" />

@if (loading()) {
  <app-loading />
} @else if (error()) {
  <app-error-banner [error]="error()!" (retry)="loadUsers()" />
} @else if (users().length === 0) {
  <app-empty-state
    icon="manage_accounts"
    title="No users found"
    message="Users appear here once they register." />
} @else {
  <table mat-table [dataSource]="users()" class="mat-elevation-z2">
    <!-- Username -->
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Username</th>
      <td mat-cell *matCellDef="let u">{{ u.username }}</td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <!-- Status chips -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let u">
        <mat-chip-set>
          @if (!u.enabled) {
            <mat-chip color="warn">Inactive</mat-chip>
          }
          @if (u.account_locked) {
            <mat-chip color="warn">Locked</mat-chip>
          }
          @if (u.enabled && !u.account_locked) {
            <mat-chip color="primary">Active</mat-chip>
          }
        </mat-chip-set>
      </td>
    </ng-container>

    <!-- Row actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u">
        <button mat-icon-button aria-label="Edit user" (click)="openEditDialog(u)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button aria-label="Manage roles" (click)="openManageRoles(u)">
          <mat-icon>manage_accounts</mat-icon>
        </button>
        @if (u.account_locked) {
          <button
            mat-icon-button
            aria-label="Unlock account"
            [disabled]="u.email === currentUserEmail"
            [matTooltip]="u.email === currentUserEmail ? 'Cannot unlock your own account' : ''"
            (click)="unlockUser(u)">
            <mat-icon>lock_open</mat-icon>
          </button>
        } @else {
          <button
            mat-icon-button
            aria-label="Lock account"
            [disabled]="u.email === currentUserEmail"
            [matTooltip]="u.email === currentUserEmail ? 'Cannot lock your own account' : ''"
            (click)="lockUser(u)">
            <mat-icon>lock</mat-icon>
          </button>
        }
        <button
          mat-icon-button
          color="warn"
          aria-label="Delete user"
          [disabled]="u.email === currentUserEmail"
          [matTooltip]="u.email === currentUserEmail ? 'Cannot delete your own account' : ''"
          (click)="deleteUser(u)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    [pageIndex]="page()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPage($event)"
    aria-label="Users pagination">
  </mat-paginator>
}
