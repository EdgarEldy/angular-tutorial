<h2 mat-dialog-title>Manage roles -- {{ user().username }}</h2>

<mat-dialog-content>
  @if (loadingDetail()) {
    <div class="center">
      <mat-spinner diameter="32" />
    </div>
  } @else if (allRoles().length === 0) {
    <p class="empty-hint">No roles defined in the system.</p>
  } @else {
    <p class="section-label">Roles</p>
    <!-- One checkbox per role; pre-checked when already assigned to the user -->
    <div class="checkbox-list">
      @for (r of allRoles(); track r.id) {
        <mat-checkbox
          [checked]="isChecked(r.id)"
          [disabled]="saving()"
          (change)="toggle(r.id)">
          {{ r.role_name }}
        </mat-checkbox>
      }
    </div>

    @if (businessError()) {
      <p class="business-error">{{ businessError() }}</p>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [disabled]="saving()" (click)="cancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    [disabled]="loadingDetail() || saving()"
    (click)="save()">
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      Save
    }
  </button>
</mat-dialog-actions>
