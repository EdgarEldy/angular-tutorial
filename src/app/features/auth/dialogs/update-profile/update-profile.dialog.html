<h2 mat-dialog-title>Edit profile</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
      @if (form.controls.username.hasError('serverError')) {
        <mat-error>{{ form.controls.username.getError('serverError') }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.hasError('serverError')) {
        <mat-error>{{ form.controls.email.getError('serverError') }}</mat-error>
      }
    </mat-form-field>

    @if (serverError()) {
      <p class="server-error">{{ serverError() }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="undefined">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    [disabled]="loading() || form.invalid"
    (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="20" />
    } @else {
      Save
    }
  </button>
</mat-dialog-actions>
