<app-page-header title="Customers">
  <!-- Only ADMIN users see the create button; the backend enforces the same rule -->
  <button *appHasRole="'ADMIN'" mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    New customer
  </button>
</app-page-header>

<!-- Name search: debounced in the component constructor via toObservable -->
<div class="filter-bar">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Search by name</mat-label>
    <input
      matInput
      placeholder="Search customers..."
      (input)="onSearchFilter($any($event.target).value)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>

@if (loading()) {
  <app-loading />
} @else if (error()) {
  <app-error-banner [error]="error()!" (retry)="loadCustomers()" />
} @else if (customers().length === 0) {
  <app-empty-state
    icon="people"
    title="No customers found"
    message="Try adjusting the search or create a new customer." />
} @else {
  <div class="table-container">
    <table mat-table [dataSource]="customers()">

      <!-- Full name column: combines first_name and last_name -->
      <ng-container matColumnDef="full_name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <!-- Clicking a row navigates to the detail page -->
        <td mat-cell *matCellDef="let c" class="clickable" (click)="navigateToDetail(c)">
          {{ c.first_name }} {{ c.last_name }}
        </td>
      </ng-container>

      <!-- Email column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let c" class="clickable" (click)="navigateToDetail(c)">
          {{ c.email }}
        </td>
      </ng-container>

      <!-- Telephone column -->
      <ng-container matColumnDef="telephone">
        <th mat-header-cell *matHeaderCellDef>Telephone</th>
        <td mat-cell *matCellDef="let c" class="clickable" (click)="navigateToDetail(c)">
          {{ c.telephone }}
        </td>
      </ng-container>

      <!-- Row actions column: edit/delete visible to ADMIN only -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <ng-container *appHasRole="'ADMIN'">
            <button mat-icon-button aria-label="Edit customer" (click)="openEditDialog(c)">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              aria-label="Delete customer"
              (click)="deleteCustomer(c)">
              <mat-icon>delete</mat-icon>
            </button>
          </ng-container>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- MatPaginator is 0-based; the backend page param is also 0-based -->
    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPage($event)"
      aria-label="Select page of customers" />
  </div>
}
