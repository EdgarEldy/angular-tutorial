server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular deep-link routing:
    # Return index.html for any path that does not match a real file so the
    # Angular router can handle the URL client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the identity API (Spring Security backend) running on the host.
    # In a Docker Compose setup the backend runs as a separate service; here
    # host.docker.internal resolves to the Docker host so we can reach a
    # backend started outside of Compose (e.g. via ./mvnw spring-boot:run).
    location /api {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The business API also runs on port 8080 (never simultaneously with the
    # identity API). The /api/v1 block must come first so nginx matches the
    # more specific prefix before falling through to /api.
    location /api/v1 {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable access log for health-check pings to reduce noise.
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
